apiVersion: apps/v1
kind: Deployment
metadata:
  name: playground
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: playground
  template:
    metadata:
      labels:
        app: playground
    spec:
      containers:
        - name: playgrounds
          image: docker.io/library/busybox:1.37.0
          command: ["/bin/sh", "-ec"]
          args:
            - |
              mkdir -p /tmp/www
              printf '%s\n' 'Hello World depuis GitLab local !' > /tmp/www/index.html
              exec httpd -f -p 8888 -h /tmp/www
          ports:
            - name: http
              containerPort: 8888
          readinessProbe:
            httpGet:
              path: /
              port: http
