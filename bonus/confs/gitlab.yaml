apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: gitlab
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
        - name: gitlab
          image: docker.io/gitlab/gitlab-ce:19.6.1-ce.0
          env:
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://gitlab.iot.test:8081'
                letsencrypt['enable'] = false
                prometheus_monitoring['enable'] = false
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            exec:
              command:
                - curl
                - --fail
                - --silent
                - --max-time
                - "4"
                - -H
                - "Host: gitlab.iot.test:8081"
                - "http://127.0.0.1:8081/-/readiness?all=1"
            timeoutSeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: gitlab-data
              mountPath: /etc/gitlab
              subPath: config
            - name: gitlab-data
              mountPath: /var/log/gitlab
              subPath: logs
            - name: gitlab-data
              mountPath: /var/opt/gitlab
              subPath: data
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: gitlab-data
          persistentVolumeClaim:
            claimName: gitlab-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  selector:
    app: gitlab
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  # Les pods accèdent à la même URL que le poste, sans passer par le port-forward.
  gitlab.override: |
    rewrite name exact gitlab.iot.test gitlab.gitlab.svc.cluster.local
